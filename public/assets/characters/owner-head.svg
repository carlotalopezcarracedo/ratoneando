<svg xmlns="http://www.w3.org/2000/svg" width="120" height="144" viewBox="0 0 120 144">
  <!--
    El dueño · cabeza 3/4 mirando a la IZQUIERDA. Cara alargada y estrecha,
    pelo oscuro rizado con volumen y barba completa. Sin ojos ni cejas: capas
    dinámicas que se montan desde el código.
  -->
  <defs>
    <linearGradient id="ohSkin" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f2c8a2"/>
      <stop offset="0.5" stop-color="#dfa87c"/>
      <stop offset="1" stop-color="#bc8560"/>
    </linearGradient>
    <linearGradient id="ohHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a302a"/>
      <stop offset="0.55" stop-color="#211a16"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="ohBeard" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#332a23"/>
      <stop offset="1" stop-color="#1a1512"/>
    </linearGradient>
  </defs>

  <!-- cuello fino -->
  <path d="M54 100 L82 100 L84 140 L52 140 Z" fill="#c68c64" stroke="#7a4c33" stroke-width="4" stroke-linejoin="round"/>
  <path d="M54 100 L82 100 L82 112 C70 118 58 116 54 110Z" fill="#a06e4d" opacity="0.6"/>

  <!-- cara alargada -->
  <path d="M28 58 C28 32 44 16 66 16 C88 16 100 33 100 58 C100 78 96 96 84 108 C74 118 58 118 48 108 C42 102 38 94 35 86 C31 82 25 78 22 72 C19 66 21 61 28 58Z"
        fill="url(#ohSkin)" stroke="#7a4c33" stroke-width="4" stroke-linejoin="round"/>

  <!-- oreja -->
  <path d="M98 58 C108 56 111 66 108 74 C105 81 99 82 97 78Z" fill="#dda179" stroke="#7a4c33" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- nariz recta y fina -->
  <path d="M26 60 C22 68 20 76 24 80 C27 83 32 83 36 81" fill="none" stroke="#a56c4c" stroke-width="3.4" stroke-linecap="round"/>

  <!-- barba completa: patillas, mandíbula y perilla -->
  <path d="M30 76 C32 92 40 106 54 112 C70 119 86 110 92 92 C96 80 97 68 96 58 C99 76 99 96 92 110 C82 128 58 130 46 118 C36 108 30 92 30 76Z"
        fill="url(#ohBeard)"/>
  <path d="M31 74 C36 86 44 94 54 96 C52 106 55 114 62 120 C48 118 34 100 31 74Z" fill="#241d18"/>
  <path d="M36 84 C50 96 76 94 92 82 C91 100 80 116 62 118 C46 120 39 100 36 84Z"
        fill="url(#ohBeard)" stroke="#141010" stroke-width="3" stroke-linejoin="round"/>
  <!-- bigote -->
  <path d="M28 74 C40 68 54 68 63 72 C54 79 38 80 28 74Z" fill="#241d18"/>

  <!-- pelo rizado con volumen -->
  <path d="M26 56 C22 34 34 12 60 9 C86 6 102 24 100 52 C104 40 102 24 92 16 C104 20 108 34 104 46 C110 34 104 16 92 10 C80 3 62 1 48 6 C32 12 24 28 26 56Z"
        fill="url(#ohHair)"/>
  <path d="M25 52 C21 26 40 8 64 8 C88 8 104 26 101 52 C96 34 82 24 64 24 C44 24 30 34 25 52Z"
        fill="url(#ohHair)" stroke="#120e0c" stroke-width="4" stroke-linejoin="round"/>
  <!-- rizos del contorno -->
  <g fill="url(#ohHair)" stroke="#120e0c" stroke-width="3.4">
    <circle cx="34" cy="26" r="11"/>
    <circle cx="52" cy="13" r="12"/>
    <circle cx="72" cy="11" r="12"/>
    <circle cx="90" cy="22" r="11"/>
    <circle cx="99" cy="40" r="9"/>
    <circle cx="26" cy="44" r="9"/>
  </g>
  <g fill="#4b3f37" opacity="0.75">
    <circle cx="50" cy="18" r="5"/>
    <circle cx="72" cy="16" r="5"/>
    <circle cx="88" cy="26" r="4"/>
  </g>
  <!-- patillas -->
  <path d="M27 50 C28 62 30 70 32 76 C26 68 24 58 27 50Z" fill="#1c1613"/>
  <path d="M99 52 C99 64 97 72 94 78 C99 70 101 60 99 52Z" fill="#1c1613"/>
</svg>
