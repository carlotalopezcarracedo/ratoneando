<svg xmlns="http://www.w3.org/2000/svg" width="152" height="184" viewBox="0 0 152 184">
  <!--
    El dueño · cabeza DE FRENTE, dibujada entera (cara, pelo rizado con volumen,
    barba completa, cejas y ojos) para que las facciones encajen. Desde el
    código sólo se añaden iris, pupilas y párpados.
    Centros de los ojos: (57, 74) y (95, 74).
  -->
  <defs>
    <linearGradient id="ohSkin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f4cba6"/>
      <stop offset="0.5" stop-color="#e2ab7f"/>
      <stop offset="1" stop-color="#bf8862"/>
    </linearGradient>
    <linearGradient id="ohHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#40352d"/>
      <stop offset="0.5" stop-color="#241d17"/>
      <stop offset="1" stop-color="#130f0c"/>
    </linearGradient>
    <linearGradient id="ohBeard" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#342a22"/>
      <stop offset="1" stop-color="#1a1511"/>
    </linearGradient>

    <g id="ohFace">
      <ellipse cx="76" cy="76" rx="42" ry="50"/>
      <path d="M42 96 C46 122 58 138 76 138 C94 138 106 122 110 96 Z"/>
      <rect x="60" y="126" width="32" height="46" rx="12"/>
    </g>
  </defs>

  <!-- 1) contorno de cara y cuello -->
  <g fill="#7c4d33" stroke="#7c4d33" stroke-width="9" stroke-linejoin="round">
    <use href="#ohFace"/>
  </g>
  <!-- 2) relleno -->
  <g fill="url(#ohSkin)">
    <use href="#ohFace"/>
  </g>
  <!-- sombra del cuello -->
  <path d="M60 128 C68 138 86 138 92 128 L92 140 C82 148 68 146 60 140Z" fill="#a3704e" opacity="0.65"/>

  <!-- orejas -->
  <path d="M34 76 C26 74 24 86 30 94 C34 99 39 99 41 95Z" fill="#dda179" stroke="#7c4d33" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M118 76 C126 74 128 86 122 94 C118 99 113 99 111 95Z" fill="#dda179" stroke="#7c4d33" stroke-width="3.6" stroke-linejoin="round"/>

  <!-- nariz -->
  <path d="M76 76 C74 86 71 92 68 96 C71 99 81 99 84 96 C81 92 78 86 76 76Z" fill="#d9a077" opacity="0.85"/>
  <path d="M67 97 C71 100 81 100 85 97" fill="none" stroke="#a06a4a" stroke-width="3" stroke-linecap="round"/>

  <!-- barba completa -->
  <path d="M36 88 C40 104 52 112 76 112 C100 112 112 104 116 88
           C118 112 112 132 96 142 C84 149 68 149 56 142 C40 132 34 112 36 88Z"
        fill="url(#ohBeard)" stroke="#141010" stroke-width="4" stroke-linejoin="round"/>
  <!-- bigote -->
  <path d="M58 102 C66 98 86 98 94 102 C88 110 64 110 58 102Z" fill="#241d18"/>
  <!-- boca -->
  <path d="M64 114 C70 118 82 118 88 114" fill="none" stroke="#7e4a44" stroke-width="4" stroke-linecap="round"/>
  <!-- textura de la barba -->
  <g stroke="#4a3d31" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
    <path d="M52 118 C54 128 58 136 64 141"/>
    <path d="M76 122 C76 132 76 140 76 145"/>
    <path d="M100 118 C98 128 94 136 88 141"/>
  </g>

  <!-- ojos -->
  <ellipse cx="57" cy="74" rx="11" ry="8" fill="#f9f2e6" stroke="#8a5c3c" stroke-width="2.4"/>
  <ellipse cx="95" cy="74" rx="11" ry="8" fill="#f9f2e6" stroke="#8a5c3c" stroke-width="2.4"/>

  <!-- cejas marcadas -->
  <path d="M43 58 C50 51 66 51 71 57" fill="none" stroke="#241d17" stroke-width="8" stroke-linecap="round"/>
  <path d="M81 57 C86 51 102 51 109 58" fill="none" stroke="#241d17" stroke-width="8" stroke-linecap="round"/>

  <!-- pelo oscuro, rizado y con volumen -->
  <path d="M32 66 C26 44 32 20 52 11 C62 6 72 8 78 13
           C86 6 100 6 110 14 C126 24 130 46 124 68
           C120 44 104 32 78 32 C50 32 36 44 32 66Z"
        fill="url(#ohHair)" stroke="#130f0c" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- rizos -->
  <g stroke="#54473c" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M44 30 C50 21 60 19 66 24"/>
    <path d="M72 20 C80 14 92 15 97 22"/>
    <path d="M102 26 C112 27 118 36 118 46"/>
    <path d="M38 46 C40 37 44 31 50 28"/>
  </g>
  <!-- patillas hasta la barba -->
  <path d="M34 60 C33 74 34 84 37 92 C30 82 29 68 34 60Z" fill="#1e1813"/>
  <path d="M118 60 C119 74 118 84 115 92 C122 82 123 68 118 60Z" fill="#1e1813"/>
</svg>
