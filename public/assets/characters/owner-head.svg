<svg xmlns="http://www.w3.org/2000/svg" width="130" height="162" viewBox="0 0 130 162">
  <!--
    El dueño · cabeza 3/4 mirando a la IZQUIERDA, dibujada entera de una vez
    (cara, pelo rizado, barba, ojos y cejas) para que las facciones encajen.
    Desde el código sólo se añaden las pupilas y los párpados.
    Centros de los ojos: (50, 64) y (86, 60).
  -->
  <defs>
    <linearGradient id="ohSkin" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f3caa4"/>
      <stop offset="0.5" stop-color="#e0a97d"/>
      <stop offset="1" stop-color="#bd8660"/>
    </linearGradient>
    <linearGradient id="ohHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3c322b"/>
      <stop offset="0.55" stop-color="#221b16"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="ohBeard" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#31281f"/>
      <stop offset="1" stop-color="#191410"/>
    </linearGradient>
  </defs>

  <!-- cuello (debajo de todo) -->
  <path d="M55 108 L88 108 L90 158 L53 158 Z" fill="#c48b63" stroke="#794b32" stroke-width="4" stroke-linejoin="round"/>
  <path d="M55 108 L88 108 L88 122 C74 129 60 126 55 119Z" fill="#9e6c4c" opacity="0.6"/>

  <!-- cara -->
  <path d="M33 58 C34 30 50 16 73 16 C97 16 111 34 111 62 C111 88 105 108 92 118
           C79 128 60 126 49 113 C43 106 39 97 36 88 C30 84 24 78 23 71 C22 64 27 59 33 58Z"
        fill="url(#ohSkin)" stroke="#794b32" stroke-width="4" stroke-linejoin="round"/>

  <!-- oreja -->
  <path d="M108 62 C118 60 121 71 117 79 C114 86 108 87 106 82Z"
        fill="#dda179" stroke="#794b32" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- aleta de la nariz -->
  <path d="M26 76 C30 80 34 81 38 80" fill="none" stroke="#a56c4c" stroke-width="3" stroke-linecap="round"/>

  <!-- barba completa: rellena la mitad inferior y sube por las patillas -->
  <path d="M34 78 C46 87 62 91 78 89 C93 87 104 80 110 70
           C110 93 104 112 92 122 C78 134 56 132 45 118 C38 108 34 92 34 78Z"
        fill="url(#ohBeard)" stroke="#141010" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M104 50 C110 58 111 66 110 74 C106 66 102 58 100 52Z" fill="#221b16"/>
  <path d="M34 62 C33 70 33 76 35 82 C30 74 30 66 34 62Z" fill="#221b16"/>
  <!-- textura de la barba -->
  <g stroke="#463a2f" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
    <path d="M50 100 C54 108 58 114 64 118"/>
    <path d="M68 100 C69 110 70 116 71 120"/>
    <path d="M86 96 C85 106 82 114 78 119"/>
  </g>
  <!-- boca dentro de la barba -->
  <path d="M40 95 C48 99 58 99 64 96" fill="none" stroke="#7c4a44" stroke-width="4" stroke-linecap="round"/>

  <!-- ojos -->
  <ellipse cx="50" cy="64" rx="10" ry="7.6" fill="#f7efe1" stroke="#8a5c3c" stroke-width="2.2"/>
  <ellipse cx="86" cy="60" rx="9" ry="7" fill="#f7efe1" stroke="#8a5c3c" stroke-width="2.2"/>

  <!-- cejas marcadas -->
  <path d="M38 51 C45 45 58 45 63 50" fill="none" stroke="#221b16" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M77 46 C84 41 95 42 99 48" fill="none" stroke="#221b16" stroke-width="7" stroke-linecap="round"/>

  <!-- pelo oscuro, rizado y con volumen -->
  <path d="M30 64 C24 44 26 24 40 14 C48 8 58 7 64 11
           C70 4 82 4 90 10 C100 6 112 14 115 28
           C119 44 117 56 113 68
           C109 47 95 35 74 33 C52 31 35 43 30 64Z"
        fill="url(#ohHair)" stroke="#120e0c" stroke-width="4" stroke-linejoin="round"/>
  <!-- rizos marcados dentro del pelo -->
  <g stroke="#4e4238" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M40 30 C46 22 54 20 60 24"/>
    <path d="M66 20 C74 14 84 15 88 21"/>
    <path d="M94 24 C102 24 108 32 108 40"/>
    <path d="M34 46 C36 38 40 33 46 30"/>
  </g>
</svg>
