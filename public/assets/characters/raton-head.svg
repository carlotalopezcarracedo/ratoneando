<svg xmlns="http://www.w3.org/2000/svg" width="184" height="132" viewBox="0 0 184 132">
  <!--
    Ratón · cabeza estrecha con hocico largo y afilado (tipo podenco), mirando a
    la IZQUIERDA. Sin orejas ni ojos: son capas aparte. La base baja-derecha
    hace de cuello y solapa con el torso.
  -->
  <defs>
    <linearGradient id="rhFur" x1="0.3" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#473b35"/>
      <stop offset="0.45" stop-color="#292019"/>
      <stop offset="1" stop-color="#130f0d"/>
    </linearGradient>
    <radialGradient id="rhNose" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5b5052"/>
      <stop offset="0.45" stop-color="#1c1517"/>
      <stop offset="1" stop-color="#0a0708"/>
    </radialGradient>
    <clipPath id="rhClip">
      <path d="M164 46 C164 20 145 6 120 7 C97 8 79 22 71 42 C65 56 44 60 26 66 C11 71 9 84 25 89 C40 93 56 95 70 93 C76 106 88 116 104 120 C122 124 142 120 154 108 C162 116 172 124 182 128 L182 74 C172 66 165 58 164 46Z"/>
    </clipPath>
  </defs>

  <path d="M164 46 C164 20 145 6 120 7 C97 8 79 22 71 42 C65 56 44 60 26 66 C11 71 9 84 25 89 C40 93 56 95 70 93 C76 106 88 116 104 120 C122 124 142 120 154 108 C162 116 172 124 182 128 L182 74 C172 66 165 58 164 46Z"
        fill="url(#rhFur)" stroke="#0f0b0a" stroke-width="5" stroke-linejoin="round"/>

  <g clip-path="url(#rhClip)">
    <!-- frente y caña del hocico iluminadas -->
    <path d="M78 40 C92 20 118 10 142 20 C158 27 165 38 165 50 C150 28 126 18 104 24 C92 27 84 33 78 40Z"
          fill="#61534b" opacity="0.6"/>
    <path d="M70 44 C56 52 40 58 26 64 C42 62 58 56 72 50Z" fill="#5a4d46" opacity="0.5"/>
    <!-- mejilla -->
    <ellipse cx="126" cy="86" rx="30" ry="21" fill="#3e332c" opacity="0.5"/>
    <!-- barbilla blanca -->
    <path d="M40 82 C54 76 70 82 76 93 C82 104 74 114 60 112 C46 110 34 98 40 82Z" fill="#f2e8d7" opacity="0.9"/>
    <!-- sombra bajo el hocico -->
    <path d="M20 86 C36 96 56 98 72 94 C58 106 32 104 20 92Z" fill="#0b0808" opacity="0.5"/>
  </g>

  <!-- nariz -->
  <path d="M26 60 C38 55 50 60 51 70 C52 80 42 86 30 84 C16 81 12 65 26 60Z"
        fill="url(#rhNose)" stroke="#0a0707" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="30" cy="64" rx="6" ry="3.4" fill="#8d8285" opacity="0.6"/>
  <path d="M33 81 L34 90" stroke="#0a0707" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 90 C44 97 58 96 66 89" fill="none" stroke="#0a0707" stroke-width="3.4" stroke-linecap="round"/>

  <!-- bigotes -->
  <g stroke="#a39489" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <path d="M48 66 C64 60 78 58 92 60"/>
    <path d="M50 75 C66 73 80 73 94 76"/>
  </g>
</svg>
