<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128">
  <!--
    Ratón · oreja enorme y de punta, vista de frente. Se dibuja apuntando
    arriba-derecha y en el juego se refleja para la del otro lado.
    Pivote en la base (abajo-centro).
  -->
  <defs>
    <linearGradient id="reFur" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#2a211b"/>
      <stop offset="0.55" stop-color="#3b302a"/>
      <stop offset="1" stop-color="#1a1411"/>
    </linearGradient>
    <linearGradient id="reIn" x1="0.3" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#7c554f"/>
      <stop offset="0.55" stop-color="#9a736c"/>
      <stop offset="1" stop-color="#5a3b39"/>
    </linearGradient>
  </defs>

  <path d="M40 122 C22 108 12 78 16 46 C19 20 30 6 44 10 C58 14 72 40 80 70
           C87 96 84 116 70 124 C60 129 48 128 40 122Z"
        fill="url(#reFur)" stroke="#0f0b0a" stroke-width="6" stroke-linejoin="round"/>

  <path d="M43 110 C30 98 24 74 27 48 C29 28 36 20 44 23 C53 27 63 48 69 72
           C75 94 73 108 63 113 C55 117 48 115 43 110Z"
        fill="url(#reIn)"/>

  <!-- pelillos del interior -->
  <g stroke="#c0968f" stroke-width="2.2" stroke-linecap="round" opacity="0.45">
    <path d="M36 44 l9 6"/><path d="M40 64 l10 6"/><path d="M46 84 l10 6"/>
  </g>
  <!-- brillo del borde -->
  <path d="M44 10 C57 14 70 38 78 66" fill="none" stroke="#6d5d53" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
</svg>
