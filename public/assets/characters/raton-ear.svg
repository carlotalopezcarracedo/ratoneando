    <linearGradient id="reFur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a302c"/>
      <stop offset="0.5" stop-color="#231c19"/>
      <stop offset="1" stop-color="#120e0d"/>
    </linearGradient>
    <linearGradient id="reIn" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#8b6260"/>
      <stop offset="0.6" stop-color="#664643"/>
      <stop offset="1" stop-color="#412b2b"/>
    </linearGradient>
  </defs>

  <path d="M46 128 C16 118 6 78 12 42 C16 16 32 4 47 10 C64 17 80 52 82 88 C83 112 70 132 46 128Z"
