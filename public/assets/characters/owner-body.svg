<svg xmlns="http://www.w3.org/2000/svg" width="190" height="234" viewBox="0 0 190 234">
  <!--
    El dueño · torso DE FRENTE con sudadera negra con capucha: capucha caída
    por detrás, cordones y bolsillo canguro. Hombros estrechos y tronco largo
    (190 cm, 70 kg). Pivote abajo, en la cadera.
  -->
  <defs>
    <linearGradient id="obHood" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3b383f"/>
      <stop offset="0.42" stop-color="#232128"/>
      <stop offset="1" stop-color="#131217"/>
    </linearGradient>

    <g id="obTorso">
      <path d="M60 24 L130 24 L152 44 L160 110 L162 214 L28 214 L30 110 L38 44 Z"/>
      <circle cx="42" cy="52" r="24"/>
      <circle cx="148" cy="52" r="24"/>
      <rect x="30" y="150" width="130" height="66" rx="16"/>
    </g>
  </defs>

  <!-- capucha caída, por detrás -->
  <path d="M56 20 C62 -2 128 -2 134 20 C150 30 152 52 142 62 C132 40 58 40 48 62 C38 52 40 30 56 20Z"
        fill="#1a1920" stroke="#0e0d11" stroke-width="5" stroke-linejoin="round"/>

  <!-- 1) contorno del torso -->
  <g fill="#0f0e12" stroke="#0f0e12" stroke-width="11" stroke-linejoin="round">
    <use href="#obTorso"/>
  </g>
  <!-- 2) relleno -->
  <g fill="url(#obHood)">
    <use href="#obTorso"/>
  </g>

  <!-- cuello de la capucha -->
  <path d="M62 24 C72 42 118 42 128 24 C134 40 122 54 95 54 C68 54 56 40 62 24Z" fill="#100f14"/>
  <path d="M70 30 C82 42 108 42 120 30" fill="none" stroke="#3a3841" stroke-width="3" opacity="0.8"/>

  <!-- cordones -->
  <g stroke="#d3cdc1" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M80 48 C77 70 77 88 79 104"/>
    <path d="M110 48 C113 70 113 88 111 102"/>
  </g>
  <circle cx="79" cy="107" r="4" fill="#8f8a82"/>
  <circle cx="111" cy="105" r="4" fill="#8f8a82"/>

  <!-- bolsillo canguro -->
  <path d="M40 148 C42 176 48 192 54 200 L136 200 C142 192 148 176 150 148
           C132 162 58 162 40 148Z"
        fill="#1a1920" stroke="#0e0d11" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 148 C58 162 132 162 150 148" fill="none" stroke="#413f48" stroke-width="3" opacity="0.7"/>

  <!-- pliegues -->
  <g stroke="#474550" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.42">
    <path d="M40 78 C36 108 36 150 40 196"/>
    <path d="M150 78 C154 108 154 150 150 196"/>
  </g>
  <!-- bajo elástico -->
  <path d="M28 200 L162 200 L162 214 L28 214Z" fill="#100f14" opacity="0.9"/>
  <g stroke="#2c2a32" stroke-width="2.4" opacity="0.8">
    <path d="M44 202 L44 213"/><path d="M62 202 L62 213"/><path d="M80 202 L80 213"/>
    <path d="M98 202 L98 213"/><path d="M116 202 L116 213"/><path d="M134 202 L134 213"/>
  </g>
</svg>
