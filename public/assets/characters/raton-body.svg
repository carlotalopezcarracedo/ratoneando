<svg xmlns="http://www.w3.org/2000/svg" width="240" height="264" viewBox="0 0 240 264">
  <!--
    Ratón · cabeza + cuello + tronco DE FRENTE (3/4), en una sola pieza.
    Truco de dibujo: la silueta se compone con formas simples y se pinta dos
    veces — primero trazada gruesa en tinta, después rellena encima. Así la
    unión de todas las formas queda con un contorno limpio y sin líneas
    internas. Orejas, patas y cola van aparte.
  -->
  <defs>
    <linearGradient id="rbFur" x1="0.3" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#4b403a"/>
      <stop offset="0.38" stop-color="#2b221c"/>
      <stop offset="1" stop-color="#14100e"/>
    </linearGradient>
    <linearGradient id="rbBib" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/>
      <stop offset="1" stop-color="#d3c2a8"/>
    </linearGradient>
    <radialGradient id="rbNose" cx="0.38" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#655a5c"/>
      <stop offset="0.5" stop-color="#1d1618"/>
      <stop offset="1" stop-color="#0a0708"/>
    </radialGradient>

    <g id="rbShape">
      <ellipse cx="120" cy="60" rx="47" ry="43"/>
      <ellipse cx="95" cy="86" rx="25" ry="23"/>
      <ellipse cx="145" cy="86" rx="25" ry="23"/>
      <ellipse cx="120" cy="106" rx="26" ry="24"/>
      <ellipse cx="120" cy="142" rx="30" ry="30"/>
      <ellipse cx="120" cy="190" rx="49" ry="49"/>
      <ellipse cx="81" cy="218" rx="24" ry="30"/>
      <ellipse cx="159" cy="218" rx="24" ry="30"/>
      <ellipse cx="120" cy="216" rx="42" ry="32"/>
    </g>
  </defs>

  <!-- 1) contorno -->
  <g fill="#0f0b0a" stroke="#0f0b0a" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <use href="#rbShape"/>
  </g>
  <!-- 2) relleno -->
  <g fill="url(#rbFur)">
    <use href="#rbShape"/>
  </g>

  <!-- luz cálida por arriba -->
  <ellipse cx="112" cy="34" rx="34" ry="18" fill="#6a5a51" opacity="0.5"/>
  <ellipse cx="120" cy="158" rx="34" ry="16" fill="#5c4e46" opacity="0.4"/>
  <!-- sombra bajo el vientre -->
  <ellipse cx="120" cy="234" rx="44" ry="16" fill="#0b0808" opacity="0.45"/>

  <!-- babero blanco: garganta y pecho, como la mancha real -->
  <path d="M120 124 C129 132 132 144 128 156 C137 170 140 192 133 210
           C127 224 113 224 107 210 C100 192 103 170 112 156
           C108 144 111 132 120 124Z"
        fill="url(#rbBib)"/>
  <path d="M120 126 C127 134 129 144 126 155" fill="none" stroke="#c2b096" stroke-width="2.4" opacity="0.6"/>

  <!-- hocico: caña iluminada, nariz y boca -->
  <ellipse cx="120" cy="100" rx="19" ry="15" fill="#3b302a" opacity="0.55"/>
  <path d="M107 92 C112 87 128 87 133 92 C136 99 130 106 120 106 C110 106 104 99 107 92Z"
        fill="url(#rbNose)" stroke="#0a0707" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="113" cy="93" rx="5" ry="3" fill="#8f8487" opacity="0.6"/>
  <path d="M120 106 L120 113" stroke="#0a0707" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 113 C114 120 106 120 101 115" fill="none" stroke="#0a0707" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M120 113 C126 120 134 120 139 115" fill="none" stroke="#0a0707" stroke-width="3.2" stroke-linecap="round"/>

  <!-- bigotes -->
  <g stroke="#a4958a" stroke-width="1.7" stroke-linecap="round" opacity="0.45">
    <path d="M100 98 C90 96 82 92 76 88"/>
    <path d="M100 104 C90 104 82 103 75 100"/>
    <path d="M140 98 C150 96 158 92 164 88"/>
    <path d="M140 104 C150 104 158 103 165 100"/>
  </g>
</svg>
