<svg xmlns="http://www.w3.org/2000/svg" width="200" height="132" viewBox="0 0 200 132">
  <!-- Ratón · torso. Orientado hacia la IZQUIERDA (pecho a la izquierda, grupa a la derecha). -->
  <defs>
    <linearGradient id="rbFur" x1="0.35" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3d3330"/>
      <stop offset="0.42" stop-color="#241d1a"/>
      <stop offset="1" stop-color="#130f0e"/>
    </linearGradient>
    <linearGradient id="rbChest" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f7efe1"/>
      <stop offset="1" stop-color="#d9c8ae"/>
    </linearGradient>
    <clipPath id="rbClip">
      <path d="M26 66 C28 36 58 17 104 17 C152 17 184 34 190 63 C196 90 183 114 156 121 C120 130 60 128 36 115 C23 108 24 83 26 66Z"/>
    </clipPath>
  </defs>

  <path d="M26 66 C28 36 58 17 104 17 C152 17 184 34 190 63 C196 90 183 114 156 121 C120 130 60 128 36 115 C23 108 24 83 26 66Z"
        fill="url(#rbFur)" stroke="#100c0b" stroke-width="5" stroke-linejoin="round"/>

  <g clip-path="url(#rbClip)">
    <!-- lomo brillante -->
    <path d="M34 56 C46 28 78 16 112 18 C150 20 176 34 188 58 C170 36 138 26 108 27 C72 28 46 38 34 56Z"
          fill="#574a45" opacity="0.55"/>
    <!-- sombra de la barriga -->
    <path d="M22 96 C60 128 146 130 194 100 C186 128 130 138 74 132 C44 128 26 116 22 96Z"
          fill="#0c0908" opacity="0.5"/>
    <!-- mancha blanca del pecho -->
    <path d="M24 68 C34 60 46 64 50 76 C55 90 50 108 40 116 C30 124 18 120 14 108 C10 92 14 76 24 68Z"
          fill="url(#rbChest)"/>
    <path d="M24 68 C34 60 46 64 50 76 C55 90 50 108 40 116" fill="none" stroke="#c0ad93" stroke-width="2.5" opacity="0.7"/>
    <!-- textura de pelo corto -->
    <g stroke="#4b3f3a" stroke-width="2" stroke-linecap="round" opacity="0.4">
      <path d="M86 34 l10 7"/><path d="M104 30 l10 7"/><path d="M122 33 l10 7"/>
      <path d="M140 40 l9 8"/><path d="M156 50 l8 8"/><path d="M70 42 l9 8"/>
    </g>
  </g>
</svg>
