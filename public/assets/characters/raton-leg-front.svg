<svg xmlns="http://www.w3.org/2000/svg" width="42" height="120" viewBox="0 0 42 120">
  <!-- Ratón · pata delantera fina con calcetín blanco. Pivote arriba (hombro). -->
  <defs>
    <linearGradient id="rlfFur" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#3d322c"/>
      <stop offset="0.5" stop-color="#251d18"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="rlfSock" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f8f1e5"/>
      <stop offset="1" stop-color="#cebda3"/>
    </linearGradient>
  </defs>

  <!-- hombro ancho que se afina hacia la muñeca -->
  <path d="M8 8 C8 1 34 1 34 10 C34 24 30 38 28 52 C26 64 25 74 25 84 C25 92 11 92 11 84 C11 72 9 58 8 44 C7 30 7 16 8 8Z"
        fill="url(#rlfFur)" stroke="#0f0b0a" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- calcetín + pata -->
  <path d="M10 82 C16 78 25 78 27 83 C29 92 29 100 30 106 C33 110 33 114 28 115 C22 116 13 116 9 114 C5 112 6 108 9 105 C9 97 9 89 10 82Z"
        fill="url(#rlfSock)" stroke="#0f0b0a" stroke-width="4.5" stroke-linejoin="round"/>
  <g stroke="#b6a488" stroke-width="2.3" stroke-linecap="round">
    <path d="M14 104 l0 8"/><path d="M20 103 l0 9"/><path d="M26 104 l0 8"/>
  </g>
  <path d="M13 14 C12 36 11 60 12 82" fill="none" stroke="#584a42" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
